<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Login Lab</title><style>
body{font-family:Arial,sans-serif;background:#071426;color:#eef5ff;margin:0}
main{max-width:700px;margin:45px auto;padding:20px}
.card{background:#102541;border:1px solid #31537c;border-radius:18px;padding:28px}
h1{margin-top:0}.sub{color:#a9bed8}
label{display:block;margin:14px 0 6px}
input{width:100%;box-sizing:border-box;padding:13px;border-radius:9px;border:1px solid #4b6c8d;background:#071426;color:#fff}
button,.btn{display:inline-block;margin-top:18px;padding:12px 18px;border:0;border-radius:9px;background:#70c7ff;color:#071426;font-weight:700;text-decoration:none}
.msg{padding:10px;margin:8px 0;border-radius:8px;background:#402832}
.security{margin-top:25px;color:#a9bed8;font-size:14px;line-height:1.6}
a{color:#86d2ff;margin-right:10px}
</style></head><body><main><div class="card">{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="msg">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</div></main></body></html>
